name: Build and Test

on:
  push:
    branches: [ master, debug-actions ]
  pull_request:
    branches: [ master, debug-actions ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Debug Java version
      run: |
        java -version
        echo "JAVA_HOME: $JAVA_HOME"
        
    - name: Debug Gradle version
      run: ./gradlew --version
      
    - name: Build with Gradle (debug)
      run: ./gradlew build --info --stacktrace
      
    - name: Build Docker image (debug)
      run: |
        docker version
        ./gradlew buildImage --info --stacktrace
      
    - name: Run tests (debug)
      run: ./gradlew test --info --stacktrace 